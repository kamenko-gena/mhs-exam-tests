<h3>Вопросы РПО</h3>

@if(showQuestions()) {
<app-exam-area
    sectionName="{{sectionName}}-{{(showQuestions() ?? '' )}}"
    [allQuestionsData]="((showQuestions() ?? '' ) === 'exam') ? examQuestions : allQuestions"
></app-exam-area>
} @else {
<button
    class="section-button"
    [disabled]="setLoading()"
    tuiButton
    (click)="startQuestions('all')"
    [showLoader]="setLoading()"
>
    Все вопросы
</button>
<button
    class="section-button"
    [disabled]="setLoading()"
    tuiButton
    (click)="startQuestions('exam')"
    [showLoader]="setLoading()"
>
    Экзамен
</button>
<app-questions-data-list></app-questions-data-list>
}
